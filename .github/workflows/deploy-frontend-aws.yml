name: Deploy Frontend to AWS Lambda

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - public/**
      - aws/frontend/**
      - index.html
      - package.json
      - package-lock.json
      - vite.config.js
      - .github/workflows/deploy-frontend-aws.yml
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  FUNCTION_NAME: dc-sports-landing-frontend
  ROLE_NAME: dc-sports-fastapi-lambda-role

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
          cache: npm

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and package frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          set -euo pipefail
          npm ci
          npm run build
          mkdir package
          cp aws/frontend/handler.mjs package/handler.mjs
          cp -r dist package/dist
          cd package
          zip -r ../frontend.zip .

      - name: Deploy Lambda
        run: |
          set -euo pipefail

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ROLE_ARN="arn:aws:iam::$ACCOUNT_ID:role/$ROLE_NAME"

          if aws lambda get-function \
            --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --zip-file fileb://frontend.zip >/dev/null

            aws lambda wait function-updated \
              --function-name "$FUNCTION_NAME"

            aws lambda update-function-configuration \
              --function-name "$FUNCTION_NAME" \
              --runtime nodejs22.x \
              --handler handler.handler \
              --timeout 10 \
              --memory-size 256 >/dev/null
          else
            aws lambda create-function \
              --function-name "$FUNCTION_NAME" \
              --runtime nodejs22.x \
              --handler handler.handler \
              --role "$ROLE_ARN" \
              --zip-file fileb://frontend.zip \
              --timeout 10 \
              --memory-size 256 >/dev/null

            aws lambda wait function-active \
              --function-name "$FUNCTION_NAME"
          fi

          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME"

      - name: Ensure public function URL
        id: function-url
        run: |
          set -euo pipefail

          if ! aws lambda get-function-url-config \
            --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            aws lambda create-function-url-config \
              --function-name "$FUNCTION_NAME" \
              --auth-type NONE >/dev/null
          else
            aws lambda update-function-url-config \
              --function-name "$FUNCTION_NAME" \
              --auth-type NONE >/dev/null
          fi

          aws lambda remove-permission \
            --function-name "$FUNCTION_NAME" \
            --statement-id FunctionUrlPublicAccess >/dev/null 2>&1 || true

          aws lambda add-permission \
            --function-name "$FUNCTION_NAME" \
            --statement-id FunctionUrlPublicAccess \
            --action lambda:InvokeFunctionUrl \
            --principal "*" \
            --function-url-auth-type NONE >/dev/null

          aws lambda remove-permission \
            --function-name "$FUNCTION_NAME" \
            --statement-id FunctionUrlPublicInvokeAccess >/dev/null 2>&1 || true

          aws lambda add-permission \
            --function-name "$FUNCTION_NAME" \
            --statement-id FunctionUrlPublicInvokeAccess \
            --action lambda:InvokeFunction \
            --principal "*" \
            --invoked-via-function-url >/dev/null

          SITE_URL=$(aws lambda get-function-url-config \
            --function-name "$FUNCTION_NAME" \
            --query FunctionUrl \
            --output text)

          echo "site-url=$SITE_URL" >> "$GITHUB_OUTPUT"

      - name: Verify deployment
        env:
          SITE_URL: ${{ steps.function-url.outputs.site-url }}
        run: |
          set -euo pipefail

          for attempt in {1..12}; do
            STATUS=$(curl --silent --output /dev/null \
              --write-out "%{http_code}" "$SITE_URL")

            if [ "$STATUS" = "200" ]; then
              echo "### AWS Lambda deployment" >> "$GITHUB_STEP_SUMMARY"
              echo "$SITE_URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            sleep 5
          done

          echo "The deployed frontend did not return HTTP 200."
          exit 1
